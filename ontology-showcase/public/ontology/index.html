<style>
:root {
  --bg: #060e12;
  --panel: rgba(8, 20, 28, 0.88);
  --line: rgba(120, 200, 220, 0.08);
  --text: #e0eef3;
  --muted: #7baabb;
  --phys: #5da0f5;
  --logic: #2dd4a0;
  --cross: #f5c842;

  --gov: #ef4460;
  --biz: #b08cf8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.55 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  user-select: none;
}

/* ---------- 星空背景 ---------- */
#starfield {
  position: fixed; inset: 0; z-index: -1;
  background:
    radial-gradient(ellipse 900px 600px at 75% 10%, rgba(45,180,150,0.035) 0%, transparent 60%),
    radial-gradient(ellipse 500px 400px at 15% 80%, rgba(140,120,220,0.03) 0%, transparent 55%),
    radial-gradient(ellipse 700px 500px at 55% 45%, rgba(60,180,200,0.02) 0%, transparent 50%),
    var(--bg);
}
#starfield .s1, #starfield .s2, #starfield .s3, #starfield .s4 {
  position: absolute; border-radius: 50%;
}
/* 小星 — 1px, 非常多, 最暗 */
#starfield .s1 {
  width: 1px; height: 1px; background: transparent;
  box-shadow:
    127vw 18vh 0 0 rgba(200,220,240,0.25), 3vw 82vh 0 0 rgba(180,210,230,0.2),
    91vw 34vh 0 0 rgba(210,230,255,0.22), 56vw 7vh 0 0 rgba(190,215,235,0.18),
    12vw 63vh 0 0 rgba(200,220,240,0.2), 78vw 91vh 0 0 rgba(180,210,225,0.22),
    35vw 45vh 0 0 rgba(210,225,245,0.15), 99vw 58vh 0 0 rgba(195,215,235,0.2),
    47vw 29vh 0 0 rgba(200,220,240,0.18), 68vw 76vh 0 0 rgba(180,210,230,0.22),
    23vw 93vh 0 0 rgba(210,230,255,0.2), 84vw 12vh 0 0 rgba(190,215,235,0.25),
    6vw 51vh 0 0 rgba(200,225,245,0.18), 72vw 39vh 0 0 rgba(195,215,240,0.2),
    41vw 87vh 0 0 rgba(180,210,230,0.22), 95vw 66vh 0 0 rgba(200,220,240,0.15),
    18vw 4vh 0 0 rgba(210,225,245,0.2), 60vw 73vh 0 0 rgba(190,215,235,0.18),
    33vw 21vh 0 0 rgba(200,220,240,0.22), 87vw 48vh 0 0 rgba(180,210,225,0.2),
    52vw 95vh 0 0 rgba(195,220,240,0.18), 15vw 36vh 0 0 rgba(210,230,255,0.2),
    76vw 84vh 0 0 rgba(200,215,235,0.15), 43vw 57vh 0 0 rgba(190,210,230,0.22),
    29vw 69vh 0 0 rgba(200,225,245,0.18), 64vw 15vh 0 0 rgba(180,210,230,0.2),
    8vw 44vh 0 0 rgba(210,220,240,0.22), 93vw 27vh 0 0 rgba(195,215,235,0.18),
    50vw 82vh 0 0 rgba(200,220,240,0.2), 21vw 55vh 0 0 rgba(190,215,240,0.15),
    82vw 97vh 0 0 rgba(180,210,230,0.22), 37vw 8vh 0 0 rgba(210,225,245,0.18),
    70vw 62vh 0 0 rgba(200,220,240,0.2), 4vw 75vh 0 0 rgba(195,215,235,0.22),
    96vw 41vh 0 0 rgba(190,210,230,0.15), 26vw 31vh 0 0 rgba(200,225,245,0.2),
    58vw 88vh 0 0 rgba(180,210,225,0.18), 14vw 99vh 0 0 rgba(210,230,255,0.22),
    79vw 6vh 0 0 rgba(200,220,240,0.18), 45vw 52vh 0 0 rgba(195,215,240,0.2),
    31vw 78vh 0 0 rgba(190,215,235,0.22), 67vw 23vh 0 0 rgba(200,225,245,0.15),
    2vw 16vh 0 0 rgba(210,220,240,0.2), 88vw 59vh 0 0 rgba(180,210,230,0.18);
  animation: twinkle1 8s ease-in-out infinite alternate;
}
/* 中星 — 1.5px, 数量适中 */
#starfield .s2 {
  width: 1.5px; height: 1.5px; background: transparent;
  box-shadow:
    85vw 22vh 0 0 rgba(210,230,250,0.3), 19vw 67vh 0 0 rgba(200,220,240,0.28),
    53vw 11vh 0 0 rgba(220,235,255,0.25), 38vw 89vh 0 0 rgba(195,215,240,0.3),
    74vw 42vh 0 0 rgba(205,225,245,0.28), 7vw 34vh 0 0 rgba(210,230,250,0.25),
    62vw 79vh 0 0 rgba(200,220,240,0.3), 28vw 53vh 0 0 rgba(195,220,245,0.28),
    91vw 95vh 0 0 rgba(220,235,255,0.25), 45vw 18vh 0 0 rgba(205,225,245,0.3),
    16vw 84vh 0 0 rgba(210,230,250,0.28), 69vw 36vh 0 0 rgba(200,225,245,0.25),
    33vw 72vh 0 0 rgba(195,215,240,0.3), 82vw 9vh 0 0 rgba(220,235,255,0.28),
    51vw 61vh 0 0 rgba(205,225,245,0.25), 4vw 47vh 0 0 rgba(210,220,240,0.3),
    77vw 88vh 0 0 rgba(200,220,240,0.28), 23vw 26vh 0 0 rgba(195,220,245,0.25),
    59vw 97vh 0 0 rgba(220,235,255,0.3), 95vw 54vh 0 0 rgba(205,225,245,0.28),
    41vw 5vh 0 0 rgba(210,230,250,0.25), 11vw 76vh 0 0 rgba(200,220,240,0.3);
  animation: twinkle2 11s ease-in-out infinite alternate;
}
/* 亮星 — 2px, 少量 */
#starfield .s3 {
  width: 2px; height: 2px; background: transparent;
  box-shadow:
    73vw 15vh 0 0 rgba(230,240,255,0.35), 32vw 82vh 0 0 rgba(220,235,250,0.32),
    56vw 44vh 0 0 rgba(235,245,255,0.3), 88vw 71vh 0 0 rgba(225,238,252,0.35),
    14vw 38vh 0 0 rgba(230,240,255,0.3), 67vw 93vh 0 0 rgba(220,235,250,0.32),
    42vw 7vh 0 0 rgba(235,245,255,0.35), 95vw 58vh 0 0 rgba(225,240,255,0.3),
    25vw 65vh 0 0 rgba(220,235,250,0.32), 80vw 24vh 0 0 rgba(230,240,255,0.35);
  animation: twinkle3 14s ease-in-out infinite alternate;
}
/* 十字衍射亮星 — 极少量, 带微弱光芒 */
#starfield .s4 {
  width: 2px; height: 2px; background: rgba(220,235,250,0.3);
  box-shadow: 0 0 4px 1px rgba(200,225,245,0.12), 0 0 10px 3px rgba(180,210,240,0.04);
}
#starfield .s4::before, #starfield .s4::after {
  content: ''; position: absolute; background: rgba(210,230,250,0.06);
}
#starfield .s4::before { width: 20px; height: 1px; top: 50%; left: 50%; transform: translate(-50%,-50%); }
#starfield .s4::after  { width: 1px; height: 20px; top: 50%; left: 50%; transform: translate(-50%,-50%); }

@keyframes twinkle1 { 0% { opacity: .65; } 100% { opacity: 1; } }
@keyframes twinkle2 { 0% { opacity: .55; } 100% { opacity: .9; } }
@keyframes twinkle3 { 0% { opacity: .45; } 100% { opacity: .8; } }
#stage { position: fixed; inset: 0; cursor: grab; }
#stage.dragging { cursor: grabbing; }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }

/* ---------- node / link / layer labels ---------- */
.node-label {
  position: absolute; transform: translate(-50%, -100%);
  pointer-events: auto; cursor: pointer; text-align: center;
  padding: 3px 9px 4px; border-radius: 9px;
  background: rgba(6, 14, 18, 0.72); border: 1px solid var(--line);
  backdrop-filter: blur(3px); white-space: nowrap;
  transition: opacity .25s;
}
.node-label b { font-size: 12.5px; letter-spacing: .2px; }
.node-label i { display: block; font-style: normal; font-size: 10.5px; color: var(--muted); }
.node-label .cnt { color: #fff; opacity: .75; font-weight: 400; font-size: 10.5px; margin-left: 4px; }
.node-label.dim { opacity: .42; pointer-events: none; }
.node-label.sel { border-color: rgba(255,255,255,.55); box-shadow: 0 0 18px rgba(80,180,200,.35); }

.link-label {
  position: absolute; transform: translate(-50%, -50%);
  font-size: 9.5px; color: #b9c4dd; white-space: nowrap;
  padding: 1px 6px; border-radius: 7px;
  background: rgba(6, 14, 18, 0.62); border: 1px solid rgba(255,255,255,.06);
  transition: opacity .25s;
}
.link-label.dim { opacity: .28; }
.link-label.hot { color: #fff; border-color: rgba(255,255,255,.3); font-size: 10.5px; z-index: 3; }

.layer-label {
  position: absolute; transform: translate(0, -50%);
  padding: 6px 12px; border-radius: 10px;
  background: rgba(6, 14, 18, 0.55); border-left: 3px solid #fff;
  transition: opacity .25s;
}
.layer-label b { font-size: 13.5px; }
.layer-label span { display: block; font-size: 10.5px; color: var(--muted); }
.layer-label .phase-tag { display: inline-block; font-size: 8.5px; font-weight: 600; padding: 1px 6px; border-radius: 4px; margin-left: 6px; letter-spacing: .3px; vertical-align: middle; }
.layer-label .phase-tag.done { background: rgba(45,212,160,.18); color: #2dd4a0; border: 1px solid rgba(45,212,160,.35); }
.layer-label .phase-tag.todo { background: rgba(255,180,70,.12); color: #ffb547; border: 1px solid rgba(255,180,70,.3); }

.sublayer-label {
  position: absolute; transform: translate(-100%, -50%);
  z-index: 2;
  min-width: 92px; padding: 5px 9px; border-radius: 8px;
  background: rgba(13, 18, 24, 0.78); border: 1px solid rgba(245, 200, 66, 0.2);
  box-shadow: inset 2px 0 0 rgba(245, 200, 66, 0.58);
  color: #f7d96d; pointer-events: none; transition: opacity .25s;
}
.sublayer-label b { display: block; font-size: 10.5px; letter-spacing: .4px; }
.sublayer-label span { display: block; margin-top: 1px; color: var(--muted); font-size: 8.5px; }

.chip-label {
  position: absolute; transform: translate(-50%, -50%);
  font-size: 10px; color: #dde8f0; white-space: nowrap;
  padding: 2px 8px; border-radius: 8px;
  background: rgba(18, 28, 42, 0.85); border: 1px solid rgba(176, 140, 248, 0.45);
}
.chip-label em { font-style: normal; opacity: .65; margin-left: 4px; font-size: 9px; }

/* ---------- top bar ---------- */
#topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 10;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 12px 18px;
  background: linear-gradient(180deg, rgba(7,11,22,.92), rgba(7,11,22,0));
  pointer-events: none;
}
#topbar > * { pointer-events: auto; }
.brand b { font-size: 17px; letter-spacing: .4px; }
.brand span { display: block; font-size: 11px; color: var(--muted); }
.stats { display: flex; gap: 8px; flex-wrap: wrap; }
.stat {
  padding: 4px 11px; border-radius: 9px; font-size: 11.5px;
  background: rgba(255,255,255,.05); border: 1px solid var(--line); color: #c8d3ea;
}
.stat b { color: #fff; margin-right: 3px; }
.spacer { flex: 1; }
.btn {
  padding: 7px 14px; border-radius: 10px; border: 1px solid var(--line);
  background: rgba(255,255,255,.06); color: var(--text);
  font-size: 12.5px; cursor: pointer; transition: all .15s;
}
.btn:hover { background: rgba(255,255,255,.13); }
.btn.primary { background: linear-gradient(135deg, #1a8a6a, #3080b0); border-color: transparent; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.15); }
.btn.off { opacity: .5; }

/* ---------- detail panel ---------- */
#panel {
  position: fixed; top: 64px; right: 16px; bottom: 16px; z-index: 9; width: 360px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
  backdrop-filter: blur(10px); overflow-y: auto; padding: 18px;
  transform: translateX(395px); transition: transform .3s cubic-bezier(.2,.8,.25,1);
}
#panel.open { transform: none; }
#panel::-webkit-scrollbar { width: 6px; }
#panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 3px; }
#panel .close { position: absolute; top: 12px; right: 12px; background: none; border: none; color: var(--muted); font-size: 17px; cursor: pointer; }
#panel .kicker { font-size: 10.5px; letter-spacing: 1.2px; color: var(--muted); text-transform: uppercase; }
#panel h2 { font-size: 20px; margin: 2px 0 0; }
#panel h2 small { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 8px; }
#panel .desc { color: #b9c4dd; font-size: 12.5px; margin: 8px 0 4px; }
#panel section { margin-top: 15px; }
#panel h3 {
  font-size: 11px; color: var(--muted); letter-spacing: .8px; font-weight: 600;
  margin-bottom: 7px; display: flex; align-items: center; gap: 6px;
}
#panel h3::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.tagrow { display: flex; flex-wrap: wrap; gap: 5px; }
.tg {
  font-size: 11px; padding: 2.5px 8px; border-radius: 7px;
  background: rgba(255,255,255,.06); border: 1px solid var(--line); color: #d4ddf0;
}
.tg.pk { background: rgba(61,169,252,.16); border-color: rgba(61,169,252,.4); }
.grp { margin-bottom: 9px; }
.grp .gname { font-size: 11px; color: #9fb3e0; margin-bottom: 4px; }
.lkrow, .acrow {
  display: flex; align-items: center; gap: 8px; padding: 6px 9px; margin: 4px 0;
  border-radius: 9px; background: rgba(255,255,255,.04); border: 1px solid transparent;
  font-size: 11.5px; cursor: pointer; transition: all .15s;
}
.lkrow:hover { border-color: rgba(255,255,255,.22); background: rgba(255,255,255,.08); }
.lkrow .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.lkrow code { font-size: 11px; color: #e3eaff; }
.lkrow .dir { color: var(--muted); font-size: 10.5px; margin-left: auto; white-space: nowrap; }
.acrow { cursor: default; align-items: flex-start; }
.acrow .mode {
  flex: none; font-size: 9.5px; padding: 2px 7px; border-radius: 6px; font-weight: 600;
  margin-top: 1px; letter-spacing: .3px;
}
.acrow .nm { color: #e3eaff; font-family: Consolas, monospace; font-size: 11px; }
.acrow .ds { color: var(--muted); font-size: 10.5px; }

/* ---------- case selector ---------- */
.case-wrap {
  position: relative;
}
.case-dropdown {
  display: none;
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  width: 340px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  backdrop-filter: blur(12px);
  padding: 6px;
  box-shadow: 0 12px 40px rgba(0,0,0,.5);
  z-index: 20;
}
.case-dropdown.open {
  display: block;
}
.case-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 10px 14px;
  border-radius: 10px;
  cursor: pointer;
  transition: background .15s;
  border: 1px solid transparent;
}
.case-item:hover {
  background: rgba(255,255,255,.08);
  border-color: rgba(255,255,255,.12);
}
.case-item.active {
  background: rgba(45,212,160,.1);
  border-color: rgba(45,212,160,.3);
}
.case-item .case-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}
.case-item.active .case-title::before {
  content: "●";
  color: #2dd4a0;
  font-size: 9px;
}
.case-item .case-desc {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.45;
  padding-left: 0;
}

/* ---------- command output ---------- */
.cmd-tag {
  display: inline-block;
  font-size: 9.5px;
  font-weight: 700;
  color: #fff;
  letter-spacing: .4px;
  padding: 2px 8px;
  border-radius: 6px;
  margin-right: 6px;
}
.cmd-tag.phase1 { background: linear-gradient(135deg, #e67e22, #d35400); }
.cmd-tag.phase2 { background: linear-gradient(135deg, #27ae60, #1e8449); }
.cmd-tag.user   { background: linear-gradient(135deg, #3498db, #2980b9); }
.cmd-tag.ok     { background: #27ae60; font-size: 10px; }
.cmd-line {
  font-family: Consolas, "Courier New", monospace;
  font-size: 12px;
  color: #b8d4e8;
  background: rgba(0,0,0,.32);
  padding: 2px 8px;
  border-radius: 5px;
  display: inline-block;
  margin: 3px 0;
  border-left: 3px solid #e67e22;
}
.cmd-line.config { border-left-color: #ef4460; }
.cmd-line.restore { border-left-color: #2dd4a0; }
.cmd-output {
  font-family: Consolas, "Courier New", monospace;
  font-size: 11px;
  line-height: 1.5;
  color: #a8c4da;
  background: rgba(0,0,0,.42);
  border: 1px solid rgba(120,200,220,.12);
  border-radius: 8px;
  padding: 10px 14px;
  margin: 6px 0;
  white-space: pre;
  overflow-x: auto;
  max-height: 220px;
  overflow-y: auto;
}
.cmd-output::-webkit-scrollbar { width: 5px; height: 5px; }
.cmd-output::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 3px; }

/* ---------- story ---------- */
#story {
  position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 160%);
  z-index: 11; width: min(860px, 94vw);
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
  backdrop-filter: blur(12px); padding: 16px 20px;
  transition: transform .35s cubic-bezier(.2,.8,.25,1);
  box-shadow: 0 12px 40px rgba(0,0,0,.45);
}
#story.open { transform: translate(-50%, 0); }
#story .s-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
#story .s-step {
  font-size: 10.5px; font-weight: 700; color: #fff; letter-spacing: .5px;
  background: linear-gradient(135deg, #1a8a6a, #3080b0);
  padding: 3px 10px; border-radius: 8px;
}
#story .s-title { font-size: 15.5px; font-weight: 700; }
#story .s-action { margin-left: auto; font-size: 10.5px; color: var(--cross); font-family: Consolas, monospace; }
#story .s-text { font-size: 12.5px; color: #c8d3ea; }
#story .s-text code { color: #f0d77a; font-size: 11.5px; background: rgba(245, 200, 66, .08); padding: 0 4px; border-radius: 4px; }
#story .s-text b { color: #fff; }
#story .s-foot { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
#story .dots { display: flex; gap: 5px; margin-right: auto; }
#story .dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.18); transition: all .2s; }
#story .dots i.on { background: #3ab09a; transform: scale(1.25); }

#tooltip {
  position: fixed; z-index: 12; pointer-events: none; display: none;
  padding: 5px 10px; border-radius: 8px; font-size: 11.5px;
  background: rgba(6, 14, 20, .92); border: 1px solid rgba(100,180,200,.2); color: #dfe7f7;
}
@media (max-width: 900px) { #panel { width: 86vw; } }
</style>
<style id="poc-shell-overrides">

.node-label b { font-size: 12.5px !important; font-weight: 700 !important; letter-spacing: .1px !important; }
.node-label i { font-size: 10px !important; font-weight: 400 !important; line-height: 1.25 !important; }
.node-label .cnt { font-size: 9px !important; }
.layer-label { padding: 5px 10px !important; }
.layer-label b { font-size: 12px !important; }
#panel { top: 66px !important; right: 18px !important; bottom: 18px !important; width: 330px !important; }

/* 星点背景 — 3D深度层, 极微弱, 不遮挡主场景 */
(function stars() {
  const n = 600, pos = new Float32Array(n * 3);
  let seed = 42;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < n; i++) {
    pos[i * 3] = (rnd() - 0.5) * 400;
    pos[i * 3 + 1] = (rnd() - 0.5) * 280;
    pos[i * 3 + 2] = (rnd() - 0.5) * 400;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0x8ab8c8, size: 0.35, transparent: true, opacity: 0.18, sizeAttenuation: true })));
})();

/* ---------- 自定义轨道控制 ---------- */
const DEFAULT_VIEW = { theta: 0.62, phi: 1.24, radius: 66, target: new THREE.Vector3(0, 5.5, 0) }; // 统一稍微拉远镜头，让五层和第三层内部间距更清楚。
const orbit = { theta: DEFAULT_VIEW.theta, phi: DEFAULT_VIEW.phi, radius: DEFAULT_VIEW.radius, target: DEFAULT_VIEW.target.clone(), auto: true };

function applyOrbit() {
  const sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
  camera.position.set(
    orbit.target.x + orbit.radius * sp * Math.sin(orbit.theta),
    orbit.target.y + orbit.radius * cp,
    orbit.target.z + orbit.radius * sp * Math.cos(orbit.theta)
  );
  camera.lookAt(orbit.target);
}

let camTween = null;
function tweenView(to, dur) {
  dur = dur || 1100;
  camTween = {
    t0: performance.now(), dur,
    from: { theta: orbit.theta, phi: orbit.phi, radius: orbit.radius, target: orbit.target.clone() },
    to: { theta: to.theta !== undefined ? to.theta : orbit.theta, phi: to.phi !== undefined ? to.phi : orbit.phi, radius: to.radius !== undefined ? to.radius : orbit.radius, target: (to.target || orbit.target).clone() },
  };
}
function stepTween(now) {
  if (!camTween) return;
  let k = (now - camTween.t0) / camTween.dur;
  if (k >= 1) k = 1;
  const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
  orbit.theta = camTween.from.theta + (camTween.to.theta - camTween.from.theta) * e;
  orbit.phi = camTween.from.phi + (camTween.to.phi - camTween.from.phi) * e;
  orbit.radius = camTween.from.radius + (camTween.to.radius - camTween.from.radius) * e;
  orbit.target.lerpVectors(camTween.from.target, camTween.to.target, e);
  if (k === 1) camTween = null;
}

const drag = { on: false, btn: 0, x: 0, y: 0, moved: 0 };
stage.addEventListener("pointerdown", (ev) => {
  drag.on = true; drag.btn = ev.button; drag.x = ev.clientX; drag.y = ev.clientY; drag.moved = 0;
  orbit.auto = false; updateRotateBtn(); camTween = null;
  stage.classList.add("dragging");
});
addEventListener("pointermove", (ev) => {
  if (!drag.on) { hoverPick(ev); return; }
  const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
  drag.x = ev.clientX; drag.y = ev.clientY; drag.moved += Math.abs(dx) + Math.abs(dy);
  if (drag.btn === 2 || ev.shiftKey) {
    const k = orbit.radius / 900;
    const right = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0);
    const up = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1);
    orbit.target.addScaledVector(right, -dx * k).addScaledVector(up, dy * k);
  } else {
    orbit.theta -= dx * 0.0052;
    orbit.phi = THREE.MathUtils.clamp(orbit.phi - dy * 0.0042, 0.18, Math.PI - 0.25);
  }
});
addEventListener("pointerup", () => { drag.on = false; stage.classList.remove("dragging"); });
stage.addEventListener("wheel", (ev) => {
  ev.preventDefault();
  orbit.radius = THREE.MathUtils.clamp(orbit.radius * (1 + ev.deltaY * 0.0011), 25, 160);
}, { passive: false });
stage.addEventListener("contextmenu", (ev) => ev.preventDefault());

/* ---------- 标签系统 ---------- */
const labelItems = [];
const V = new THREE.Vector3();
function addLabel(el, getPos, offsetY) {
  labelRoot.appendChild(el);
  const item = { el, getPos, offsetY: offsetY || 0 };
  labelItems.push(item);
  return item;
}
function updateLabels() {
  const w = innerWidth, h = innerHeight;
  for (const it of labelItems) {
    if (it.el.dataset.layerHidden === "true" || it.el.dataset.nodeHidden === "true" || it.el.dataset.linkHidden === "true") { it.el.style.display = "none"; continue; }
    V.copy(it.getPos()); V.y += it.offsetY;
    V.project(camera);
    if (V.z > 1 || V.z < -1) { it.el.style.display = "none"; continue; }
    it.el.style.display = "";
    it.el.style.left = ((V.x * 0.5 + 0.5) * w) + "px";
    it.el.style.top = ((-V.y * 0.5 + 0.5) * h) + "px";
  }
}

function nodeSize() { return 0.82; } // 缩小实体模型与底部光环，降低多层视图的拥挤感。
function isTodoNode(node) { return !!node.todo || node.layer === "governance" || node.layer === "business"; }

function nodeGeometry(layer) {

    case "physical":      return new THREE.BoxGeometry(1.7, 1.7, 1.7);

    case "business":      return new THREE.IcosahedronGeometry(1.15, 0);
    default:               return new THREE.SphereGeometry(1, 20, 16);
  }
}

for (const n of DISPLAY_NODES) {

/* ---------- 连线 ---------- */
function linkCurve(link) {
  const a = nodeById[link.from], b = nodeById[link.to];
  if (!a || !b) return null;
  if (link.from === link.to) {
    const p = a._mesh.position, s = a._size;
    return new THREE.CubicBezierCurve3(
      p.clone().add(new THREE.Vector3(s + 0.2, 0.5, 0.6)),
      p.clone().add(new THREE.Vector3(s + 4.6, 3.0, 2.6)),
      p.clone().add(new THREE.Vector3(-0.6, 4.6, -2.8)),
      p.clone().add(new THREE.Vector3(-0.2, s + 0.6, -0.7))
    );
  }
  const pa = a._mesh.position.clone(), pb = b._mesh.position.clone();
  const dirAB = pb.clone().sub(pa).normalize();
  pa.addScaledVector(dirAB, a._size * 1.25);
  pb.addScaledVector(dirAB, -b._size * 1.35);
  const mid = pa.clone().add(pb).multiplyScalar(0.5);
  const dist = pa.distanceTo(pb);
  const radial = new THREE.Vector3(mid.x, 0, mid.z);
  if (radial.lengthSq() < 0.01) radial.set(0, 0, 1);
  radial.normalize();
  const sameLayer = Math.abs(pa.y - pb.y) < 3;
  const ctrl = mid.addScaledVector(radial, dist * (sameLayer ? 0.10 : 0.16)).add(new THREE.Vector3(0, sameLayer ? 1.6 : 0, 0));
  return new THREE.QuadraticBezierCurve3(pa, ctrl, pb);
}

const linkByName = {};
let linkLabelsOn = false;
for (const lk of LINKS) {
  const curve = linkCurve(lk);
  if (!curve) continue;
  const color = CAT_COLOR[lk.cat];
  const group = new THREE.Group();
  let mainMat;

  if (lk.derived) {
    const geo = new THREE.BufferGeometry().setFromPoints(curve.getPoints(48));
    mainMat = new THREE.LineDashedMaterial({ color, transparent: true, opacity: 0.28, dashSize: 0.65, gapSize: 0.45 });
    const line = new THREE.Line(geo, mainMat);
    line.computeLineDistances();
    group.add(line);
  } else {
    const tube = new THREE.Mesh(
      new THREE.TubeGeometry(curve, 40, 0.075, 7, false),
      new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.32, depthWrite: false })
    );
    mainMat = tube.material;
    group.add(tube);
  }

  const tip = curve.getPoint(1), tan = curve.getTangent(0.99).normalize();
  const cone = new THREE.Mesh(
    new THREE.ConeGeometry(0.26, 0.72, 10),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.42, depthWrite: false })
  );
  cone.position.copy(tip);
  cone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tan);
  group.add(cone);
  group.visible = false;
  scene.add(group);

  const el = document.createElement("div");
  el.className = "link-label" + (linkLabelsOn ? "" : " dim");
  el.textContent = t(lk.name) + " · " + lk.card;
  el.dataset.link = lk.name;
  el.dataset.linkHidden = "true";
  const midPt = curve.getPoint(0.5);
  addLabel(el, () => midPt, 0.35);

  lk._group = group; lk._mainMat = mainMat; lk._coneMat = cone.material; lk._label = el;
  lk._baseOpacity = lk.derived ? 0.28 : 0.32;
  linkByName[lk.name] = lk;
}

/* 默认收起连线；选中节点后展开直接关系，也可通过顶栏查看全部关系。 */
let showAllLinks = false;
let planesOn = true;
let expandedLinkNames = new Set();
let activeLayerKeys = new Set(Object.keys(LAYERS));

function updateLinkLabelVisibility(lk) {
  const label = labelItems.find((item) => item.el.dataset.link === lk.name);
  if (!label) return;
  const visible = linkLabelsOn && !!lk._group?.visible;
  label.el.dataset.linkHidden = visible ? "" : "true";
  label.el.style.display = visible ? "" : "none";
  label.el.classList.toggle("dim", !visible);
}

function layerAllowsLink(link) {
  return activeLayerKeys.has(nodeById[link.from]?.layer) && activeLayerKeys.has(nodeById[link.to]?.layer);
}

function syncExplorationLinkVisibility() {
  if (diagnosisMode || storyOn) return;
  for (const lk of LINKS) {
    if (!lk._group) continue;
    const visible = layerAllowsLink(lk) && (showAllLinks || expandedLinkNames.has(lk.name));
    lk._group.visible = visible;
    const label = labelItems.find((item) => item.el.dataset.link === lk.name);
    if (label) {
      label.el.dataset.layerHidden = layerAllowsLink(lk) ? "" : "true";
      updateLinkLabelVisibility(lk);
    }
  }
}

/* ---------- Action 轨道芯片 ---------- */
let chipGroup = null, chipLabels = [];
function clearChips() {
  if (chipGroup) { scene.remove(chipGroup); chipGroup = null; }
  for (const c of chipLabels) { c.el.remove(); const i = labelItems.indexOf(c); if (i >= 0) labelItems.splice(i, 1); }
  chipLabels = [];
}
function spawnChips(node) {
  clearChips();
  chipGroup = new THREE.Group();
  const r = node._size + 2.6;
  node.actions.forEach((name, i) => {
    const a = ACTIONS[name] || { mode: "query" };
    const ang = (i / node.actions.length) * Math.PI * 2;
    const chip = new THREE.Mesh(
      new THREE.OctahedronGeometry(0.34, 0),
      new THREE.MeshStandardMaterial({ color: 0xb08cf8, emissive: 0xb08cf8, emissiveIntensity: 0.5, roughness: 0.3 })
    );
    chip.position.set(Math.cos(ang) * r, 0.4, Math.sin(ang) * r);
    chipGroup.add(chip);

    const el = document.createElement("div");
    el.className = "chip-label";
    el.dataset.layer = node.layer;
    const m = MODE_STYLE[a.mode] || {};
    el.innerHTML = `${name}<em>${m.zh || a.mode}</em>`;
    const wp = new THREE.Vector3();
    const item = addLabel(el, () => chip.getWorldPosition(wp), 0.85);
    chipLabels.push(item);
  });
  chipGroup.position.copy(node._mesh.position);
  scene.add(chipGroup);
}

/* ---------- 高亮 / 选择 ---------- */
let selectedId = null;
let previewLayer = null;

function clearLayerPreview() {
  if (!previewLayer) return;
  const isLight = document.documentElement.classList.contains("light-theme");
  for (const [key, layer] of Object.entries(LAYERS)) {
    const isDone = (key === "physical" || key === "logical" || key === "cross_system");
    if (layer._plane) layer._plane.material.opacity = key === "cross_system" ? 0 : (isLight ? (isDone ? 0.03 : 0.014) : (isDone ? 0.018 : 0.008));
    if (layer._border) layer._border.material.opacity = key === "cross_system" ? 0 : (isLight ? (isDone ? 0.42 : 0.25) : (isDone ? 0.30 : 0.16));
  }
  for (const n of DISPLAY_NODES) {
    const isTodo = isTodoNode(n);
    n._mesh.material.opacity = isTodo ? 0.28 : 1;
    n._mesh.material.emissiveIntensity = isTodo ? 0.06 : 0.22;
    n._ring.material.opacity = isTodo ? 0.08 : 0.3;
    n._label?.classList.remove("dim");
  }
  for (const lk of LINKS) {
    if (!lk._mainMat) continue;
    lk._mainMat.opacity = lk._baseOpacity;
    lk._coneMat.opacity = 0.42;
    const lbl = labelItems.find((it) => it.el.textContent.startsWith(lk.name));
    if (lbl) lbl.el.classList.toggle("dim", !linkLabelsOn);
  }
  previewLayer = null;
}

function applyLayerPreview(layerKey) {
  clearLayerPreview();
  if (!layerKey || !LAYERS[layerKey] || selectedId || storyOn) return;
  previewLayer = layerKey;
  for (const [key, layer] of Object.entries(LAYERS)) {
    const isCurrent = key === layerKey;
    const isDone = (key === "physical" || key === "logical" || key === "cross_system");
    if (layer._plane?.visible) layer._plane.material.opacity = key === "cross_system" ? 0 : (isCurrent ? (isDone ? 0.065 : 0.045) : (isDone ? 0.012 : 0.008));
    if (layer._border?.visible) layer._border.material.opacity = key === "cross_system" ? 0 : (isCurrent ? (isDone ? 0.4 : 0.24) : (isDone ? 0.08 : 0.04));
  }
  for (const n of DISPLAY_NODES) {
    if (!n._mesh.visible) continue;
    const isCurrent = n.layer === layerKey;
    const isTodo = isTodoNode(n);
    n._mesh.material.opacity = isCurrent ? (isTodo ? 0.45 : 1) : 0.25;
    n._mesh.material.emissiveIntensity = isCurrent ? (isTodo ? 0.18 : 0.36) : 0.08;
    n._ring.material.opacity = isCurrent ? (isTodo ? 0.18 : 0.4) : 0.10;
    n._label?.classList.toggle("dim", !isCurrent);
  }
  for (const lk of LINKS) {
    if (!lk._mainMat || !lk._group.visible) continue;
    const isCurrent = nodeById[lk.from]?.layer === layerKey || nodeById[lk.to]?.layer === layerKey;
    lk._mainMat.opacity = isCurrent ? Math.min(lk._baseOpacity + 0.12, 0.68) : 0.12;
    lk._coneMat.opacity = isCurrent ? 0.9 : 0.08;
    const lbl = labelItems.find((it) => it.el.textContent.startsWith(lk.name));
    if (lbl) lbl.el.classList.toggle("dim", !isCurrent || !linkLabelsOn);
  }
}
function setNodeFaded(n, faded, strong) {
  n._mesh.material.opacity = faded ? 0.32 : (isTodoNode(n) ? 0.28 : 1);
  n._mesh.material.emissiveIntensity = strong ? 0.65 : (faded ? 0.10 : 0.22);
  n._ring.material.opacity = faded ? 0.14 : 0.3;
  const lbl = labelItems.find(it => it.el.querySelector && it.el.querySelector(`b`) && it.el.textContent.includes(n.id));
  if (lbl) { lbl.el.classList.toggle("dim", faded); lbl.el.classList.toggle("sel", !!strong); }
}
function setLinkFaded(lk, faded, hot) {
  const o = faded ? 0.18 : (hot ? 0.95 : lk._baseOpacity);
  lk._mainMat.opacity = o;
  lk._coneMat.opacity = faded ? 0.12 : (hot ? 1 : 0.42);
  const lbl = labelItems.find(it => it.el.textContent.startsWith(lk.name));
  if (lbl) { lbl.el.classList.toggle("dim", faded || (!hot && !linkLabelsOn)); lbl.el.classList.toggle("hot", !!hot); }
}

function clearHighlight() {
  clearLayerPreview();
  selectedId = null;
  expandedLinkNames.clear();
  for (const n of DISPLAY_NODES) {
    setNodeFaded(n, false, false);
    if (n._label) n._label.style.opacity = "";
  }
  for (const lk of LINKS) {
    if (lk._mainMat) setLinkFaded(lk, false, false);
    const label = labelItems.find(it => it.el.dataset.link === lk.name);
    if (label) label.el.style.opacity = "";
  }
  for (const item of labelItems) {
    if (item.el.dataset.layer) item.el.style.opacity = "";
  }
  diagnosisNodeHistory.clear();
  diagnosisLinkHistory.clear();
  clearChips();
  syncExplorationLinkVisibility();
}

function highlightSet(nodeIds, linkNames) {
  const ns = nodeIds ? new Set(nodeIds) : null;
  const ls = linkNames ? new Set(linkNames) : null;
  for (const n of DISPLAY_NODES) setNodeFaded(n, ns ? !ns.has(n.id) : false, false);
  for (const lk of LINKS) {
    if (!lk._mainMat) continue;
    const on = ls ? ls.has(lk.name) : true;
    lk._group.visible = on && layerAllowsLink(lk);
    const label = labelItems.find((item) => item.el.dataset.link === lk.name);
    if (label) updateLinkLabelVisibility(lk);
    setLinkFaded(lk, !on, on && !!ls);
  }
}

function selectNode(id) {
  if (storyOn) return;
  clearLayerPreview();
  const node = nodeById[id];
  if (!node) return;
  selectedId = id;
  const related = new Set([id]);
  const incident = [];
  for (const lk of LINKS) {
    if (lk.from === id || lk.to === id) { incident.push(lk.name); related.add(lk.from); related.add(lk.to); }
  }
  expandedLinkNames = new Set(incident);
  for (const n of DISPLAY_NODES) setNodeFaded(n, !related.has(n.id), n.id === id);
  const inc = new Set(incident);
  for (const lk of LINKS) {
    if (!lk._mainMat) continue;
    const visible = inc.has(lk.name) && layerAllowsLink(lk);
    lk._group.visible = visible;
    const label = labelItems.find((item) => item.el.dataset.link === lk.name);
    if (label) updateLinkLabelVisibility(lk);
    setLinkFaded(lk, !visible, visible);
  }
  spawnChips(node);
  showPanel(node);
  /* 聚焦时只收窄视距，保留节点周边的关系和上下文；固定上限避免连续点击逐次放大。 */
  const focusRadius = Math.max(42, Math.min(orbit.radius, DEFAULT_VIEW.radius * 0.82));
  tweenView({ target: node._mesh.position.clone(), radius: focusRadius }, 900);
}

function centroidView(nodeIds) {
  if (!nodeIds) return { target: DEFAULT_VIEW.target.clone(), radius: DEFAULT_VIEW.radius };
  const c = new THREE.Vector3();
  for (const id of nodeIds) { if (nodeById[id]) c.add(nodeById[id]._mesh.position); }
  c.multiplyScalar(1 / nodeIds.length);
  let maxD = 0;
  for (const id of nodeIds) maxD = Math.max(maxD, nodeById[id] ? nodeById[id]._mesh.position.distanceTo(c) : 0);
  return { target: c, radius: THREE.MathUtils.clamp(maxD * 1.9 + 12, 28, 53) }; // 多节点视角比例适中，保留呼吸空间。
}

  if (i === steps.length) {
    showStoryOverview();
    return;
  }
  const s = steps[i];
  updateStoryStepCopy();
  highlightSet(s.nodes, s.links);
  const v = centroidView(s.nodes);
  tweenView({ target: v.target, radius: v.radius, theta: DEFAULT_VIEW.theta + 0.22 * i, phi: 1.12 }, 1200);
}

  const allNodes = new Set();
  const allLinks = new Set();
  for (const s of steps) {
    if (s.nodes) s.nodes.forEach(n => allNodes.add(n));
    if (s.links) s.links.forEach(l => allLinks.add(l));
  }
  /* 高亮所有节点和连线 */
  highlightSet([...allNodes], [...allLinks]);
  /* 给总览中涉及的节点额外加强发光 */
  for (const nid of allNodes) {
    const n = nodeById[nid];
    if (n) n._mesh.material.emissiveIntensity = 0.55;

  updateStoryOverviewCopy();
  /* 相机拉远，看全貌 */
  const v = centroidView([...allNodes]);

/* ---------- 外层层级过滤同步 ---------- */
function applyLayerFilter(enabled) {
  const active = new Set(enabled || Object.keys(LAYERS));
  activeLayerKeys = active;
  for (const key of Object.keys(LAYERS)) {
    const on = active.has(key);
    const layer = LAYERS[key];
    if (layer._plane) layer._plane.visible = on && planesOn;
    if (layer._border) layer._border.visible = on && planesOn;
    for (const item of labelItems) if (item.el.dataset.layer === key) { item.el.dataset.layerHidden = on ? "" : "true"; item.el.style.display = on ? "" : "none"; }
  }
  for (const segment of layerRailParts) segment.visible = active.has(segment.userData.fromKey) && active.has(segment.userData.toKey);
  for (const tick of layerRailTicks) tick.visible = active.has(tick.userData.layerKey);
  for (const sublayer of SOLUTION_SUBLAYERS) {
    const on = active.has("cross_system");
    if (sublayer._plane) sublayer._plane.visible = on && planesOn;
    if (sublayer._border) sublayer._border.visible = on && planesOn;
  }
  sublayerRailGroup.visible = planesOn && active.has("cross_system") && !diagnosisMode;
  for (const n of DISPLAY_NODES) {
    const on = active.has(n.layer);
    n._mesh.visible = on; n._ring.visible = on;
    if (n._label) { n._label.dataset.layerHidden = on ? "" : "true"; n._label.style.display = on ? "" : "none"; }
  }
  for (const lk of LINKS) {
    if (!lk._group) continue;
    const allowed = active.has(nodeById[lk.from]?.layer) && active.has(nodeById[lk.to]?.layer);
    const visible = allowed && (showAllLinks || expandedLinkNames.has(lk.name));
    lk._group.visible = visible;
    const label = labelItems.find((item) => item.el.dataset.link === lk.name);
    if (label) {
      label.el.dataset.layerHidden = allowed ? "" : "true";
      updateLinkLabelVisibility(lk);
    }
  }
}
function applyDiagnosisView({ nodes, links, contextNodes, contextLinks, zoomScale = 1, theme, compact, resetHistory = false }) {
  if (storyOn) exitStory();
  if (resetHistory) {
    diagnosisNodeHistory.clear();
    diagnosisLinkHistory.clear();
  }
  deselect();
  if (theme) applyOntologyTheme(theme);
  diagnosisMode = !!compact;
  document.documentElement.classList.toggle("embedded-diagnosis", diagnosisMode);
  layerRailGroup.visible = !diagnosisMode;
  sublayerRailGroup.visible = !diagnosisMode && planesOn;
  refreshLanguage();
  if (diagnosisMode) orbit.auto = false;
  updateRotateBtn();

  const validActiveNodes = (nodes || []).filter((id) => nodeById[id]);
  const requestedVisibleNodes = contextNodes?.length ? contextNodes : validActiveNodes;
  const validVisibleNodes = [...new Set(requestedVisibleNodes.filter((id) => nodeById[id]))];
  const knownLinkNames = new Set(LINKS.map((link) => link.name));
  const validActiveLinks = (links || []).filter((name) => knownLinkNames.has(name));
  const requestedVisibleLinks = contextLinks?.length ? contextLinks : validActiveLinks;
  const validVisibleLinks = [...new Set(requestedVisibleLinks.filter((name) => knownLinkNames.has(name)))];
  const activeNodes = new Set(validActiveNodes);
  const visibleNodes = new Set(validVisibleNodes);
  const activeLinks = new Set(validActiveLinks);
  const visibleLinks = new Set(validVisibleLinks);
  const visibleLayers = new Set(validVisibleNodes.map((id) => nodeById[id].layer));

  /* 将当前可见节点和连线记入历史，用于后续剪枝弱化 */
  for (const id of validVisibleNodes) diagnosisNodeHistory.add(id);
  for (const name of validVisibleLinks) diagnosisLinkHistory.add(name);
  /* 被剪枝的层级也需要保留弱化显示 */
  const prunedLayers = new Set();
  for (const id of diagnosisNodeHistory) {
    if (nodeById[id] && !visibleNodes.has(id)) prunedLayers.add(nodeById[id].layer);
  }

  for (const [key, layer] of Object.entries(LAYERS)) {
    const visible = visibleLayers.has(key);
    const pruned = prunedLayers.has(key);
    if (layer._plane) { layer._plane.visible = planesOn; layer._plane.material.opacity = visible ? 0.026 : (pruned ? 0.008 : 0.004); }
    if (layer._border) { layer._border.visible = planesOn; layer._border.material.opacity = visible ? 0.34 : (pruned ? 0.08 : 0.03); }
    for (const item of labelItems) {
      if (item.el.dataset.layer === key) {
        item.el.dataset.layerHidden = (visible || pruned) ? "" : "true";
        item.el.style.display = (visible || pruned) ? "" : "none";
        item.el.style.opacity = visible ? "" : (pruned ? "0.22" : "");
      }
    }
  }
  const crossSystemVisible = visibleLayers.has("cross_system") || prunedLayers.has("cross_system");
  for (const sublayer of SOLUTION_SUBLAYERS) {
    if (sublayer._plane) sublayer._plane.visible = planesOn && crossSystemVisible;
    if (sublayer._border) sublayer._border.visible = planesOn && crossSystemVisible;
  }
  sublayerRailGroup.visible = !diagnosisMode && planesOn && crossSystemVisible;

  for (const n of DISPLAY_NODES) {
    const visible = visibleNodes.has(n.id);
    const active = activeNodes.has(n.id);
    const pruned = !visible && diagnosisNodeHistory.has(n.id);  /* 曾出现但被剪枝 */
    const isTodo = isTodoNode(n);
    if (visible) {
      n._mesh.visible = true;
      n._ring.visible = true;
      setNodeFaded(n, !active, active);
    } else if (pruned) {
      /* 剪枝节点：保留可见但极度弱化 */
      n._mesh.visible = true;
      n._ring.visible = true;
      n._mesh.material.opacity = isTodo ? 0.04 : 0.07;
      n._mesh.material.emissiveIntensity = 0.015;
      n._ring.material.opacity = 0.02;
    } else {
      n._mesh.visible = false;
      n._ring.visible = false;
    }
    if (n._label) {
      if (visible) {
        n._label.dataset.nodeHidden = "";
        n._label.style.display = "";
        n._label.style.opacity = "";
        n._label.classList.toggle("dim", !active);
        n._label.classList.toggle("sel", active);
      } else if (pruned) {
        /* 剪枝节点标签：保留但极低透明度 */
        n._label.dataset.nodeHidden = "";
        n._label.style.display = "";
        n._label.style.opacity = "0.12";
        n._label.classList.add("dim");
        n._label.classList.remove("sel");
      } else {
        n._label.dataset.nodeHidden = "true";
        n._label.style.display = "none";
        n._label.style.opacity = "";
      }
    }
  }
  for (const lk of LINKS) {
    if (!lk._group) continue;
    const visible = visibleLinks.has(lk.name);
    const active = activeLinks.has(lk.name);
    const pruned = !visible && diagnosisLinkHistory.has(lk.name);  /* 曾出现但被剪枝 */
    if (visible) {
      lk._group.visible = true;
      setLinkFaded(lk, !active, active);
    } else if (pruned) {
      /* 剪枝连线：保留可见但极度弱化 */
      lk._group.visible = true;
      lk._mainMat.opacity = 0.035;
      lk._coneMat.opacity = 0.02;
    } else {
      lk._group.visible = false;
    }
    const label = labelItems.find((item) => item.el.dataset.link === lk.name);
    if (label) {
      if (visible) {
        label.el.dataset.linkHidden = "";
        label.el.style.display = "";
        label.el.style.opacity = "";
        label.el.classList.toggle("dim", !active);
      label.el.classList.toggle("hot", active);
      } else if (pruned) {
        /* 剪枝连线标签：保留但极低透明度 */
        label.el.dataset.linkHidden = "";
        label.el.style.display = "";
        label.el.style.opacity = "0.08";
        label.el.classList.add("dim");
        label.el.classList.remove("hot");
      } else {
        label.el.dataset.linkHidden = "true";
        label.el.style.display = "none";
        label.el.style.opacity = "";
    }
  }
}

  if (validVisibleNodes.length) {
    const v = centroidView(validVisibleNodes);
    const diagnosisTarget = v.target.clone().lerp(DEFAULT_VIEW.target, 0.42);
    const baseDiagnosisRadius = Math.min(Math.max(v.radius * 0.95, 41), 55); // 诊断视角与默认视角同步拉远，保持清晰与开阔感。
    const diagnosisRadius = Math.max(baseDiagnosisRadius * (Number.isFinite(zoomScale) ? zoomScale : 1), 34);
    tweenView({ target: diagnosisTarget, radius: diagnosisRadius, theta: DEFAULT_VIEW.theta + 0.18, phi: DEFAULT_VIEW.phi }, 900);
  }
}
function applyOntologyTheme(theme) {
  const isLight = theme === "light";
  document.documentElement.classList.toggle("light-theme", isLight);
  const colorFactor = isLight ? 0.68 : 1;
  scene.fog.density = isLight ? 0.0035 : 0.0062;
  scene.fog.color.setHex(isLight ? LIGHT_SCENE_COLOR : 0x060e12);
  renderer.setClearColor(isLight ? LIGHT_SCENE_COLOR : 0x060e12, 1);
  for (const layer of Object.values(LAYERS)) {
    const layerColor = new THREE.Color(layer.color).multiplyScalar(colorFactor);
    const isDone = layer._isDone;
    if (layer._plane) {
      layer._plane.material.color.copy(layerColor);
      layer._plane.material.opacity = isLight ? (isDone ? 0.03 : 0.014) : (isDone ? 0.018 : 0.008);
    }
    if (layer._border) {
      layer._border.material.color.copy(layerColor);
      layer._border.material.opacity = isLight ? (isDone ? 0.42 : 0.25) : (isDone ? 0.30 : 0.16);
    }
    if (layer._railTick) layer._railTick.material.color.copy(layerColor);
  }
  for (const segment of layerRailParts) {
    const sourceColor = LAYERS[segment.userData.fromKey]?.color || 0x5d7185;
    segment.material.color.copy(new THREE.Color(sourceColor).multiplyScalar(colorFactor));
  }
  for (const sublayer of SOLUTION_SUBLAYERS) {
    const sublayerColor = new THREE.Color(sublayer.color).multiplyScalar(colorFactor);
    const panelFill = new THREE.Color(SOLUTION_PANEL_FILL).multiplyScalar(isLight ? 0.78 : 1);
    if (sublayer._plane) { sublayer._plane.material.color.copy(panelFill); sublayer._plane.material.opacity = SHOW_SOLUTION_SUBLAYER_PANELS ? (isLight ? 0.05 : 0.032) : 0; }
    if (sublayer._border) { sublayer._border.material.color.copy(sublayerColor); sublayer._border.material.opacity = SHOW_SOLUTION_SUBLAYER_GUIDES && !HIDDEN_SOLUTION_SUBLAYER_GUIDES.has(sublayer.key) ? (isLight ? 0.68 : 0.5) : 0; }
  }
  for (const segment of sublayerRailParts) {
    const sublayer = SOLUTION_SUBLAYERS.find((item) => item.key === segment.userData.fromKey);
    if (sublayer) segment.material.color.copy(new THREE.Color(sublayer.color).multiplyScalar(colorFactor));
  }
  for (const tick of sublayerRailTicks) {
    const sublayer = SOLUTION_SUBLAYERS.find((item) => item.key === tick.userData.sublayerKey);
    if (sublayer) tick.material.color.copy(new THREE.Color(sublayer.color).multiplyScalar(colorFactor));
  }
  for (const node of DISPLAY_NODES) {
    if (!node._mesh) continue;
    const nodeColor = new THREE.Color(LAYERS[node.layer].color);
    node._mesh.material.color.copy(nodeColor);
    node._mesh.material.emissive.copy(nodeColor);
    node._mesh.material.emissiveIntensity = isLight ? (isTodoNode(node) ? 0.15 : 0.38) : (isTodoNode(node) ? 0.06 : 0.22);
    node._ring.material.opacity = isLight ? (isTodoNode(node) ? 0.12 : 0.38) : (isTodoNode(node) ? 0.08 : 0.3);
  }
  for (const lk of LINKS) {
    if (!lk._mainMat) continue;
    const linkColor = new THREE.Color(CAT_COLOR[lk.cat]).multiplyScalar(colorFactor);
    lk._mainMat.color.copy(linkColor);
    if (lk._coneMat) lk._coneMat.color.copy(linkColor);
    lk._mainMat.opacity = isLight ? Math.min(lk._baseOpacity * 1.45, 0.52) : lk._baseOpacity;
    if (lk._coneMat) lk._coneMat.opacity = isLight ? 0.58 : 0.42;
  }
}
addEventListener("message", (ev) => {
  if (ev.data?.type === "ontology-layer-filter") applyLayerFilter(ev.data.enabled);
  if (ev.data?.type === "ontology-layer-preview") applyLayerPreview(ev.data.layer);
  if (ev.data?.type === "ontology-theme") applyOntologyTheme(ev.data.theme);
  if (ev.data?.type === "ontology-diagnosis-view") { if (ev.data.language) { ontologyLanguage = ev.data.language; refreshLanguage(); } applyDiagnosisView(ev.data); }
});
/* ---------- 统计 ---------- */
document.getElementById("st-obj").textContent = DISPLAY_NODES.length;
document.getElementById("st-lnk").textContent = LINKS.length;
document.getElementById("st-act").textContent = Object.keys(ACTIONS).length;
applyOntologyTheme(initialIsLight ? "light" : "dark");
refreshLanguage();
updateLinksButton();

/* ---------- 主循环 ---------- */
let lastT = performance.now();
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;
  if (orbit.auto && !camTween) orbit.theta += dt * 0.07;
  stepTween(now);
  applyOrbit();
  if (!diagnosisMode) {
    if (chipGroup) chipGroup.rotation.y += dt * 0.45;
    for (const n of DISPLAY_NODES) n._mesh.rotation.y += dt * 0.12;
  }
  renderer.render(scene, camera);
  updateLabels();
}
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
applyOrbit();
requestAnimationFrame(animate);
</script>
</body>
